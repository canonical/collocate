[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
sha2 = "0.10"
zeroize = "1"
serde-saphyr = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
tempfile = "3"
tar = "0.4"
flate2 = "1"
ruzstd = "0.9"
toml = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
httparse = "1"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
collocate-registry = { path = "crates/collocate-registry" }
collocate-pebble = { path = "crates/collocate-pebble" }
collocate-core = { path = "crates/collocate-core" }
collocate-sys = { path = "crates/collocate-sys" }
collocate-store = { path = "crates/collocate-store" }
collocate-net = { path = "crates/collocate-net" }
collocate-lb = { path = "crates/collocate-lb" }
collocate-runtime = { path = "crates/collocate-runtime" }
collocate-image = { path = "crates/collocate-image" }
collocate-compose = { path = "crates/collocate-compose" }
collocate-controller = { path = "crates/collocate-controller" }
collocate-cluster = { path = "crates/collocate-cluster" }
collocate-trust = { path = "crates/collocate-trust" }
collocate-remote = { path = "crates/collocate-remote" }
collocate-gateway = { path = "crates/collocate-gateway" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
